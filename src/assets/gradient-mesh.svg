<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Stripi gradient mesh">
  <defs>
    <filter id="meshBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="80"></feGaussianBlur>
    </filter>
    <filter id="meshBlurStrong" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="140"></feGaussianBlur>
    </filter>
  </defs>

  <rect width="1440" height="600" fill="#fef3d9"></rect>

  <g filter="url(#meshBlurStrong)" opacity="0.95">
    <ellipse cx="180" cy="320" rx="380" ry="280" fill="#fbc78a"></ellipse>
    <ellipse cx="60" cy="120" rx="260" ry="220" fill="#fde2b8"></ellipse>
  </g>

  <g filter="url(#meshBlur)" opacity="0.95">
    <ellipse cx="520" cy="280" rx="360" ry="280" fill="#d6c6ff"></ellipse>
    <ellipse cx="440" cy="500" rx="260" ry="180" fill="#e2dcff"></ellipse>
  </g>

  <g filter="url(#meshBlur)" opacity="0.95">
    <ellipse cx="900" cy="320" rx="420" ry="320" fill="#665efd"></ellipse>
    <ellipse cx="1060" cy="180" rx="260" ry="220" fill="#8073ff"></ellipse>
  </g>

  <g filter="url(#meshBlurStrong)" opacity="0.95">
    <ellipse cx="1340" cy="280" rx="380" ry="320" fill="#ea2261"></ellipse>
    <ellipse cx="1380" cy="120" rx="220" ry="180" fill="#f96bee"></ellipse>
  </g>

  <g filter="url(#meshBlur)" opacity="0.80">
    <ellipse cx="1180" cy="420" rx="240" ry="200" fill="#f96bee"></ellipse>
  </g>

  <rect width="1440" height="120" fill="url(#topFade)"></rect>
  <defs>
    <linearGradient id="topFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"></stop>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"></stop>
    </linearGradient>
  </defs>
</svg>
